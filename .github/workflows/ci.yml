name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  smoke:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run mock documentary pipeline
        run: LLM_PROVIDER=mock SCAD_DATA_DIR="$GITHUB_WORKSPACE/data" npm exec scad documentary smoke-test --question "Can humanity become a new species?" --title "Species"

      - name: Verify artifacts
        run: |
          test -f data/smoke-test/output/script.md
          test -f data/smoke-test/output/research.json
          test -f data/smoke-test/output/claims.json
          test -f data/smoke-test/output/narrative.json
          test -f data/smoke-test/output/shot-list.json
          test -f data/smoke-test/output/self-check.json
          test -f data/smoke-test/output/traceability.json
